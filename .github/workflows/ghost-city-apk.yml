name: Build Ghost City APK

on:
  push:
    paths:
      - 'ghost_city/**'
      - '.github/workflows/ghost-city-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghost_city
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep one release key across builds so new versions install over old ones.
      # If the ANDROID_KEYSTORE_BASE64 secret is set it is used; otherwise a key is
      # generated once and kept in the Actions cache.
      - name: Restore release key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ghost_city/android/app/upload-keystore.jks
          key: ghost-city-release-key-v1

      - name: Prepare release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-ghostcity-release}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          elif [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Ghost City, OU=Mobile, O=Ghost City, C=US"
          fi
          cat > android/key.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          sed -i 's/^ *//' android/key.properties

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Calls Mapillary, Wikimedia, Esri Wayback and Nominatim for real and prints
      # what they return, so a change in any archive shows up in the build log.
      - name: Live archive check
        continue-on-error: true
        run: dart run tool/api_smoke.dart

      - name: Build APKs
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          DEFINES=""
          if [ -n "$MAPILLARY_TOKEN" ]; then DEFINES="--dart-define=MAPILLARY_TOKEN=$MAPILLARY_TOKEN"; fi
          flutter build apk --release $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk ../GhostCity.apk
          flutter build apk --release --split-per-abi $DEFINES
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../GhostCity-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../GhostCity-armv7.apk

      # The Android Gradle Plugin leaves out the v1 (JAR) signature when minSdk >= 24.
      # Some installers and file managers still need it, so re-sign with v1 + v2 + v3.
      - name: Re-sign APKs with v1 + v2 + v3
        working-directory: .
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-ghostcity-release}"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for f in GhostCity.apk GhostCity-arm64.apk GhostCity-armv7.apk; do
            "$APKSIGNER" sign --ks ghost_city/android/app/upload-keystore.jks \
              --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias upload \
              --min-sdk-version 21 \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              "$f"
            rm -f "$f.idsig"
          done

      - name: Verify APK signatures
        working-directory: .
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          for f in GhostCity.apk GhostCity-arm64.apk GhostCity-armv7.apk; do
            echo "== $f"
            # --min-sdk-version 21 makes apksigner check the v1 signature too
            # (it skips v1 for apps whose minSdk is 24 or higher).
            "$APKSIGNER" verify --verbose --min-sdk-version 21 "$f" | tee /tmp/verify.txt
            unzip -l "$f" | grep -qE "META-INF/[^/]+\.(RSA|SF)$"
            grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt
            unzip -tq "$f"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GhostCity-apk
          path: |
            GhostCity.apk
            GhostCity-arm64.apk
            GhostCity-armv7.apk

      - name: Publish release for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghost-city-build-${{ github.run_number }}
          name: Ghost City (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Android APK for Ghost City (Android 7.0 or newer).
            - GhostCity-arm64.apk: most phones from 2017 onward (recommended, smaller).
            - GhostCity-armv7.apk: older 32-bit phones.
            - GhostCity.apk: works on every phone (larger).
          files: |
            GhostCity-arm64.apk
            GhostCity-armv7.apk
            GhostCity.apk
