name: Build APK

on:
  push:
    branches: [voicebeast-arena]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # Saves the build log to a branch so it can be read without logging in.
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no build log" > /tmp/build.log
          git checkout --orphan voicebeast-ci-logs
          git rm -rfq . > /dev/null
          tail -n 400 /tmp/build.log > build.log
          git add build.log
          git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f origin voicebeast-ci-logs

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk VoiceBeastArena-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBeastArena-apk
          path: VoiceBeastArena-v1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voicebeast-v1.0.0-build${{ github.run_number }}
          name: VoiceBeast Arena v1.0.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Test build of VoiceBeast Arena (test ads + test purchases enabled).
            Download the APK below and install it on your Android phone.
          files: VoiceBeastArena-v1.0.0.apk
