name: Build APK

on:
  push:
    branches: [voicebeast-arena]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk VoiceBeastArena.apk

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          tail -n 400 build.log > /tmp/build.log 2>/dev/null || echo "no build log" > /tmp/build.log
          git checkout --orphan voicebeast-ci-logs
          git rm -rfq . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Build log for run ${{ github.run_number }}"
          git push -f origin voicebeast-ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBeastArena-apk
          path: VoiceBeastArena.apk

  # Installs and launches the APK on a real Android emulator. The release is
  # only published if the app starts and keeps running.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VoiceBeastArena-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/smoke_test.sh

      - name: Save emulator logs and screenshots
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r ci_out/. /tmp/out/ 2>/dev/null || echo "no output" > /tmp/out/result.txt
          git fetch -q origin voicebeast-ci-logs || true
          git checkout --orphan voicebeast-ci-logs
          git rm -rfq . > /dev/null
          cp -r /tmp/out/. .
          rm -f logcat_full.txt.gz; gzip -k logcat_full.txt 2>/dev/null; rm -f logcat_full.txt
          git add -A
          git commit -qm "Emulator results for run ${{ github.run_number }}"
          git push -f origin voicebeast-ci-logs

  release:
    needs: emulator-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoiceBeastArena-apk

      - name: Rename APK
        run: mv VoiceBeastArena.apk VoiceBeastArena-v1.0.0.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voicebeast-v1.0.0-build${{ github.run_number }}
          name: VoiceBeast Arena v1.0.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Tested build: installed and launched on an Android 14 emulator before publishing.
            Test ads + test purchases enabled.
          files: VoiceBeastArena-v1.0.0.apk
