name: Build Real Clash APK

on:
  push:
    paths:
      - 'realclash/**'
      - '.github/workflows/realclash-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realclash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RealClash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RealClash-apk
          path: realclash/build/app/outputs/flutter-apk/RealClash.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: realclash-build-${{ github.run_number }}
          name: Real Clash APK (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: realclash/build/app/outputs/flutter-apk/RealClash.apk
