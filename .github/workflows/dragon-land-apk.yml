name: Dragon Land APK

on:
  push:
    branches: [ccr-0a0f0718-1gjeiw]
    paths: ['dragon_land/**', '.github/workflows/dragon-land-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dragon_land
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build universal release APK
        run: flutter build apk --release
      - name: Collect universal APK
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/DragonLand-release.apk
      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi
      - name: Collect per-ABI APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/DragonLand-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/DragonLand-armv7-release.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: dragon-land-apk
          path: out/*.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dragon-land-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dragon_land/tool/ci/smoke_test.sh apk/DragonLand-release.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: ci-out/

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dragon-land-apk
          path: out
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dragon-land-build-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "Dragon Land APK (build ${{ github.run_number }}, emulator-verified)" \
            --notes "Verified to launch and run on an Android emulator. Install DragonLand-release.apk (any phone) or the smaller DragonLand-arm64-release.apk (most phones from 2017 on)."
