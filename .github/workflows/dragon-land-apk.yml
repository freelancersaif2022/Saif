name: Dragon Land APK

on:
  push:
    branches: [ccr-0a0f0718-1gjeiw]
    paths: ['dragon_land/**', '.github/workflows/dragon-land-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dragon_land
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK (signed with debug key, installable)
        run: flutter build apk --release
      - name: Build per-ABI release APKs (smaller downloads)
        run: flutter build apk --release --split-per-abi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Collect APKs
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/DragonLand-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/DragonLand-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/DragonLand-armv7-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk ../out/DragonLand-debug.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: dragon-land-apk
          path: out/*.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dragon-land-build-${{ github.run_number }}"
          gh release create "$TAG" ../out/*.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Dragon Land APK (build ${{ github.run_number }})" \
            --notes "Install DragonLand-release.apk (works on every phone) or the smaller DragonLand-arm64-release.apk (most phones from 2017 onward) on an Android phone (allow installs from unknown sources). The debug APK is larger and slower; it is for development."
