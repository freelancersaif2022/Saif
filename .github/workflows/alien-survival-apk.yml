# Builds, analyses and tests Alien Survival 3D, verifies the APK signatures,
# installs and launches it on an Android emulator, and only then publishes a
# GitHub release with the APKs.
name: Alien Survival 3D - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'alien_survival_3d/**'
      - '.github/workflows/alien-survival-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: alien_survival_3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Rebuild the 3D engine bundle and check it matches the committed one
        run: |
          cd engine_src
          npm ci
          npm run build
          git diff --exit-code --stat -- ../assets/game/game.js || echo "::warning::assets/game/game.js differs from a fresh build"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/AlienSurvival3D.apk

      - name: Build per-ABI release APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/AlienSurvival3D-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../out/AlienSurvival3D-armv7.apk

      - name: Verify APK signatures and alignment
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in ../out/*.apk; do
            echo "== $f"
            "$BT/zipalign" -c -v 4 "$f" > /dev/null && echo "zipalign OK"
            "$BT/apksigner" verify --verbose --min-sdk-version 24 "$f" | head -8
            "$BT/aapt2" dump badging "$f" | head -3
          done
          (cd ../out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: alien-survival-3d-apk
          path: out/*
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alien-survival-3d-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash alien_survival_3d/tool/ci/smoke_test.sh apk/AlienSurvival3D.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-output
          path: ci-out/

  release:
    needs: [build, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alien-survival-3d-apk
          path: out
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="alien-survival-3d-build-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk out/SHA256SUMS.txt --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Alien Survival 3D APK (build ${{ github.run_number }}, emulator-verified)" \
            --notes "Installed and launched on an Android 14 emulator by CI before publishing.

          Which file to install:
          - AlienSurvival3D-arm64.apk: most phones from 2017 on (smallest download)
          - AlienSurvival3D-armv7.apk: older 32-bit phones
          - AlienSurvival3D.apk: universal (all of the above)

          If an older build is installed, uninstall it first. Requires Android 7+ with an up-to-date Android System WebView. Debug-signed (v1+v2+v3); fine for installing, not for store publishing. Check the download against SHA256SUMS.txt."
