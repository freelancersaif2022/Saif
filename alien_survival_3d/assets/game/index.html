<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Alien Survival 3D</title>
<style>
:root { --lime: #D1FE17; --panel: rgba(10, 14, 12, 0.66); --panel-b: rgba(209, 254, 23, 0.35); --red: #e8262a; --blue: #2a7bff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0c; font-family: 'Roboto Condensed', 'Arial Narrow', Roboto, Arial, sans-serif; color: #fff; touch-action: none; }
#game { position: fixed; inset: 0; }
canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
svg { width: 100%; height: 100%; display: block; }

#loading { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 40%, #1b2418, #070907); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .5s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading h1 { margin: 0; font-size: 34px; letter-spacing: 3px; color: var(--lime); font-weight: 900; text-shadow: 0 0 18px rgba(209,254,23,.35); }
#loading .track { width: min(60vw, 420px); height: 8px; background: #1d241b; border-radius: 4px; overflow: hidden; border: 1px solid #2c3a22; }
#loading-bar { height: 100%; width: 0; background: var(--lime); transition: width .2s; }
#loading-text { font-size: 13px; color: #9aa58f; letter-spacing: 1px; }

.hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--panel-b); border-radius: 10px; backdrop-filter: blur(2px); }
.stat { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; letter-spacing: .5px; }
.stat i { width: 18px; height: 18px; color: var(--lime); display: inline-block; }
.stats { left: max(10px, env(safe-area-inset-left)); top: 8px; padding: 6px 12px; display: flex; gap: 14px; align-items: center; }
.stats .score span { color: var(--lime); font-size: 18px; }
.stats .score b { margin-left: 6px; color: #ffcf33; font-size: 13px; }
.stats .remaining { position: absolute; left: 12px; top: 100%; margin-top: 3px; white-space: nowrap; font-size: 11px; font-weight: 800; color: #e8eedf; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
.stats .remaining:empty { display: none; }
.wallet { right: calc(max(10px, env(safe-area-inset-right)) + 150px); top: 8px; padding: 6px 12px; display: flex; gap: 12px; }
.wallet .coin i { color: #ffc21a; } .wallet .gem i { color: #3fb6ff; }
.radar { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 6px; width: 112px; height: 112px; }
.radar canvas { position: static; width: 100%; height: 100%; }
.pause-btn { position: absolute; right: calc(max(10px, env(safe-area-inset-right)) + 116px); top: 52px; width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid var(--lime); color: var(--lime); padding: 7px; pointer-events: auto; }
.fps { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 11px; color: var(--lime); }

.vitals { left: calc(max(10px, env(safe-area-inset-left)) + 24vh + 10px); bottom: 10px; padding: 6px; display: flex; gap: 8px; align-items: center; }
.portrait { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--lime); overflow: hidden; background: #26301f; flex: none; }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.bars { display: flex; flex-direction: column; gap: 5px; width: 150px; }
.bar { position: relative; height: 17px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
.bar i { position: absolute; left: 2px; top: 1px; width: 13px; height: 13px; z-index: 2; color: #fff; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .2s; }
.bar.hp .fill { background: linear-gradient(90deg, #a10f12, var(--red)); }
.bar.ar .fill { background: linear-gradient(90deg, #1446a8, var(--blue)); }
.bar span { position: absolute; right: 6px; top: 0; font-size: 12px; font-weight: 800; line-height: 16px; z-index: 2; text-shadow: 0 1px 2px #000; }
.buffs { display: flex; gap: 4px; font-size: 9px; }
.buffs:empty { display: none; }
.buffs b { padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,.6); }
.buffs .sh { color: #ffd23a; } .buffs .sp { color: #7ab8ff; } .buffs .ov { color: var(--lime); }
.weapon { left: 50%; transform: translateX(-50%); bottom: 10px; padding: 4px 12px 4px 6px; display: flex; align-items: center; gap: 8px; pointer-events: auto; min-width: 190px; }
.weapon img { width: 92px; height: 46px; object-fit: contain; }
.weapon .ammo { display: flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; }
.weapon .ammo i { width: 18px; height: 18px; color: var(--lime); }
.weapon .wname { position: absolute; left: 10px; top: -15px; font-size: 10px; color: var(--lime); letter-spacing: 1px; }
.weapon.empty .ammo span { color: var(--red); }
.weapon.reloading .ammo span { color: #ffcf33; animation: blink .5s infinite; }
.weapon .nades { display: flex; align-items: center; gap: 2px; font-weight: 900; font-size: 16px; padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--panel-b); }
.weapon .nades img { width: 24px; height: 24px; }
@keyframes blink { 50% { opacity: .35; } }

.crosshair { position: absolute; left: 50%; top: 50%; --gap: 8px; transition: opacity .1s; }
.crosshair.hide { opacity: 0; }
.crosshair .c { position: absolute; background: var(--lime); box-shadow: 0 0 2px #000; }
.crosshair .t, .crosshair .b { width: 2px; height: 9px; left: -1px; }
.crosshair .l, .crosshair .r { height: 2px; width: 9px; top: -1px; }
.crosshair .t { top: calc(-1 * var(--gap) - 9px); } .crosshair .b { top: var(--gap); }
.crosshair .l { left: calc(-1 * var(--gap) - 9px); } .crosshair .r { left: var(--gap); }
.crosshair .dot { position: absolute; width: 4px; height: 4px; left: -2px; top: -2px; background: var(--lime); border-radius: 50%; }
.hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; transition: opacity .1s; }
.hitmarker span { position: absolute; width: 10px; height: 2px; background: #fff; }
.hitmarker span:nth-child(1) { transform: translate(5px, 5px) rotate(45deg); } .hitmarker span:nth-child(2) { transform: translate(-15px, 5px) rotate(-45deg); }
.hitmarker span:nth-child(3) { transform: translate(5px, -7px) rotate(-45deg); } .hitmarker span:nth-child(4) { transform: translate(-15px, -7px) rotate(45deg); }
.hitmarker.head span { background: #ffcf33; } .hitmarker.kill span { background: var(--red); width: 14px; }
.dmg-ring { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; border-radius: 50%; border-top: 10px solid rgba(232, 38, 42, .85); opacity: 0; transition: opacity .3s; filter: blur(1px); }
.vignette { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(170, 0, 0, .7) 100%); }
.hud.lowhp .vignette { opacity: .5 !important; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 32vh, #000 32.3vh); }
.scope.show { display: block; }
.scope .scope-lens { position: absolute; left: 50%; top: 50%; width: 64vh; height: 64vh; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #111; }
.scope .sh, .scope .sv { position: absolute; background: #000; }
.scope .sh { left: 0; right: 0; top: 50%; height: 1.5px; } .scope .sv { top: 0; bottom: 0; left: 50%; width: 1.5px; }
.banner { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -10px); text-align: center; opacity: 0; transition: opacity .4s, transform .4s; }
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner .b-title { font-size: 46px; font-weight: 900; letter-spacing: 4px; color: var(--lime); text-shadow: 0 0 20px rgba(209,254,23,.4), 0 3px 6px #000; }
.banner .b-sub { font-size: 15px; letter-spacing: 2px; color: #e8eedf; text-shadow: 0 2px 4px #000; }
.banner.danger .b-title { color: #ff3b5c; text-shadow: 0 0 22px rgba(255, 40, 80, .5), 0 3px 6px #000; }
.countdown { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); font-weight: 800; letter-spacing: 2px; color: #e8eedf; text-shadow: 0 2px 4px #000; font-size: 16px; }
.killfeed { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 66px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.kf { background: var(--panel); border-left: 3px solid var(--lime); padding: 2px 8px; font-size: 12px; transition: opacity .5s; }
.kf b { color: #ff7a7a; } .kf em { color: #ffcf33; font-style: normal; }
.kf.fade, .toast.fade { opacity: 0; }
.toasts { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.toast { background: var(--panel); border: 2px solid var(--lime); border-radius: 6px; padding: 3px 12px; font-weight: 800; font-size: 14px; letter-spacing: 1px; transition: opacity .5s; }
.bossbar { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); width: min(46vw, 420px); display: none; text-align: center; }
.bossbar.show { display: block; }
.bossbar .bname { font-size: 13px; font-weight: 900; letter-spacing: 3px; color: #ff6bd6; text-shadow: 0 1px 3px #000; }
.bossbar .btrack { height: 10px; background: rgba(0,0,0,.7); border: 1px solid #ff6bd6; border-radius: 5px; overflow: hidden; }
.bossbar .bfill { height: 100%; width: 100%; background: linear-gradient(90deg, #7a2cff, #ff2ee6); transition: width .2s; }
.prompt { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--lime); color: var(--lime); padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; display: none; }
.prompt.show { display: block; }

.controls { position: absolute; inset: 0; z-index: 6; }
.joy { position: absolute; border-radius: 50%; }
.joy-ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(30,34,30,.55) 0, rgba(12,14,12,.7) 70%); border: 3px solid rgba(160, 170, 160, .55); box-shadow: inset 0 0 18px rgba(0,0,0,.6); }
.joy-arrow { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: .8; }
.joy-arrow.up { left: 50%; top: 6%; transform: translateX(-50%); border-bottom: 9px solid #cfd6cb; border-top: 0; }
.joy-arrow.down { left: 50%; bottom: 6%; transform: translateX(-50%); border-top: 9px solid #cfd6cb; border-bottom: 0; }
.joy-arrow.left { top: 50%; left: 6%; transform: translateY(-50%); border-right: 9px solid #cfd6cb; border-left: 0; }
.joy-arrow.right { top: 50%; right: 6%; transform: translateY(-50%); border-left: 9px solid #cfd6cb; border-right: 0; }
.joy-knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #eef1ec, #8d948a 60%, #4d534b); box-shadow: 0 3px 8px rgba(0,0,0,.6); }
.joy.active .joy-ring { border-color: var(--lime); }
.btn { position: absolute; border-radius: 50%; background: rgba(8, 10, 8, .62); border: 2.5px solid var(--lime); color: var(--lime); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.5); transition: transform .06s, background .1s; }
.btn.down, .btn.on { background: var(--lime); color: #000; }
.btn.down { transform: scale(.92); }
.btn svg { width: 56%; height: 56%; }
.btn-fire { border-width: 3.5px; background: rgba(120, 18, 18, .55); border-color: #ff5a4a; color: #ffd9d4; }
.btn-fire svg { width: 62%; height: 62%; }
.btn-fire.down { background: #ff5a4a; color: #200; }
.btn.hidden { display: none; }
.btn-badge { position: absolute; right: -4px; top: -4px; background: var(--lime); color: #000; font-size: 11px; font-weight: 900; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.controls.editing .btn, .controls.editing .joy { outline: 2px dashed #fff; outline-offset: 3px; }
.layout-bar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--lime); padding: 6px 12px; border-radius: 10px; font-size: 13px; }
.layout-bar button { background: var(--lime); color: #000; border: 0; font-weight: 900; padding: 6px 14px; border-radius: 6px; font-size: 13px; }
.layout-bar button[data-a="reset"] { background: #2b2f2a; color: #fff; }
.standalone-over { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.standalone-over h1 { color: #ff3b5c; font-size: 48px; margin: 0; }
.standalone-over button { margin-top: 16px; background: var(--lime); border: 0; padding: 12px 30px; font-weight: 900; font-size: 18px; border-radius: 8px; }
body.paused::after { content: 'PAUSED (press any key)'; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--lime); font-weight: 900; }
@media (max-height: 380px) {
  .stat { font-size: 13px; } .stats { gap: 10px; padding: 4px 10px; }
  .bars { width: 120px; } .portrait { width: 44px; height: 44px; }
  .weapon img { width: 74px; height: 37px; } .weapon .ammo { font-size: 18px; }
  .radar { width: 96px; height: 96px; } .wallet { right: calc(max(10px, env(safe-area-inset-right)) + 130px); }
  .pause-btn { right: calc(max(10px, env(safe-area-inset-right)) + 100px); top: 46px; }
  .banner .b-title { font-size: 34px; }
}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><h1>ALIEN SURVIVAL 3D</h1><div class="track"><div id="loading-bar"></div></div><div id="loading-text">Loading</div></div>
<script src="game.js"></script>
<script>
  // desktop testing: any key resumes from the standalone pause screen
  window.addEventListener('keydown', function () { if (document.body.classList.contains('paused') && window.game) window.game.resume(); });
</script>
</body>
</html>
