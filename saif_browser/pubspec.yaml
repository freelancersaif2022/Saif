name: saif_browser
description: Saif Browser - a private, fast Android web browser built with Flutter and Android System WebView.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
